; T-Deck Plus — BLE -> LoRa relay
; Receives pitch calls from the iOS app over BLE and transmits them over LoRa.

[env:tdeck_plus]
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@^7.1.2
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    ; SPI bus (shared with display and SD card)
    -DLORA_SPI_MOSI=41
    -DLORA_SPI_MISO=38
    -DLORA_SPI_SCK=40
    ; SX1262 LoRa radio
    -DLORA_CS=9
    -DLORA_RST=17
    -DLORA_DIO1=45
    -DLORA_BUSY=13
