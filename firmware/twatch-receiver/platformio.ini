; T-Watch S3 — LoRa receiver
; Listens for pitch calls from the T-Deck relay and shows them on the watch screen.

[env:twatch_s3]
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@^7.1.2
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    ; SPI bus for LoRa
    -DLORA_SPI_MOSI=1
    -DLORA_SPI_MISO=4
    -DLORA_SPI_SCK=3
    ; SX1262 LoRa radio
    -DLORA_CS=5
    -DLORA_RST=8
    -DLORA_DIO1=9
    -DLORA_BUSY=7
